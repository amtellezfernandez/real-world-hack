[project]
name = "sitewalk"
version = "0.1.0"
description = "RobotOps Sentinel backend"
authors = [
    { name = "jjovalle99", email = "jjmov99@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "encord>=0.1.195",
    "fastapi[standard]>=0.136.1",
    "google-genai>=2.0.1",
    "openai>=2.36.0",
    "pydantic-settings>=2.14.0",
    "shapely>=2.1.2",
]

[project.scripts]
sitewalk-openapi = "sitewalk.api.export_openapi:main"
sitewalk-encord-ontology = "sitewalk.review_export.encord_cli:print_ontology_main"
sitewalk-create-encord-ontology = "sitewalk.review_export.encord_cli:create_ontology_main"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[tool.fastapi]
entrypoint = "sitewalk.api.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "ANN"]

[tool.ty.terminal]
error-on-warning = true
